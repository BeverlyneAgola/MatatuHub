<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>New Complaint - MatatuHub</title>
</head>

<body>

    <h1>Record Complaint</h1>

    <form method="POST">

        <div>

            <label for="category">
                Category
            </label>

            <select name="category" id="category" required>

                <option value="internal">
                    Internal
                </option>

                <option value="external">
                    External
                </option>

            </select>

        </div>

        <br>

        <div>

            <label for="description">
                Description
            </label>

            <br>

            <textarea
                name="description"
                id="description"
                rows="6"
                cols="60"
                required
            ></textarea>

        </div>

        <br>

        <div>

            <label for="filed_by_phone">
                Phone
            </label>

            <input
                type="text"
                name="filed_by_phone"
                id="filed_by_phone"
            >

        </div>

        <br>

        <div>

            <label for="filed_by_employee_id">
                Employee
            </label>

            <select
                name="filed_by_employee_id"
                id="filed_by_employee_id"
            >

                <option value="">
                    Not an employee
                </option>

                {% for employee in employees %}

                <option value="{{ employee.id }}">
                    {{ employee.staff_id }}
                    -
                    {{ employee.first_name }}
                    {{ employee.last_name }}
                </option>

                {% endfor %}

            </select>

        </div>

        <br>

        <button type="submit">
            Record Complaint
        </button>

    </form>

    <p>
        <a href="{{ url_for('hr.list_complaints') }}">
            Back to Complaints
        </a>
    </p>

</body>

</html>
