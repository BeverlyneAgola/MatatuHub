
{% extends "internal_base.html" %}

{% block title %}New Complaint - MatatuHub{% endblock %}

{% block content %}

<section class="hr-page">

    <div class="page-header">
        <div>
            <h1>Record Complaint</h1>
            <p>Record an internal or external complaint.</p>
        </div>
    </div>

    <form method="POST" class="employee-form">

        <div class="form-group">
            <label for="category">Category</label>

            <select name="category" id="category" required>
                <option value="internal">Internal</option>
                <option value="external">External</option>
            </select>
        </div>

        <div class="form-group">
            <label for="description">Description</label>

            <textarea
                name="description"
                id="description"
                rows="6"
                required
            ></textarea>
        </div>

        <div class="form-group">
            <label for="filed_by_phone">Phone</label>

            <input
                type="text"
                name="filed_by_phone"
                id="filed_by_phone"
            >
        </div>

        <div class="form-group">
            <label for="filed_by_employee_id">Employee</label>

            <select
                name="filed_by_employee_id"
                id="filed_by_employee_id"
            >
                <option value="">Not an employee</option>

                {% for employee in employees %}
                    <option value="{{ employee.id }}">
                        {{ employee.staff_id }} -
                        {{ employee.first_name }}
                        {{ employee.last_name }}
                    </option>
                {% endfor %}
            </select>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">
                Record Complaint
            </button>

            <a href="{{ url_for('hr.list_complaints') }}"
               class="btn btn-secondary">
                Back to Complaints
            </a>
        </div>

    </form>

</section>

{% endblock %}
