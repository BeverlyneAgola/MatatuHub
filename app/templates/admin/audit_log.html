<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin - Audit Log</title>
</head>
<body>

    <h1>Audit Log</h1>

    <p>
        <a href="{{ url_for('admin.users') }}">Users</a> |
        <a href="{{ url_for('admin.roles') }}">Roles</a>
    </p>

    <table border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>User ID</th>
                <th>Action</th>
                <th>Target Table</th>
                <th>Target ID</th>
                <th>Old Value</th>
                <th>New Value</th>
                <th>Timestamp</th>
            </tr>
        </thead>

        <tbody>
            {% for log in logs %}
            <tr>
                <td>{{ log.id }}</td>
                <td>{{ log.user_id }}</td>
                <td>{{ log.action }}</td>
                <td>{{ log.target_table }}</td>
                <td>{{ log.target_id }}</td>
                <td>{{ log.old_value }}</td>
                <td>{{ log.new_value }}</td>
                <td>{{ log.timestamp }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

</body>
</html>
