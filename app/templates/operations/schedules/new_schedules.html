<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>New Schedule - MatatuHub</title>
</head>

<body>

    <h1>New Schedule</h1>

    <h2>{{ route.name }}</h2>

    <p>
        {{ route.start_point }} → {{ route.destination }}
    </p>

    {% with messages = get_flashed_messages() %}
        {% if messages %}
            <div>
                {% for message in messages %}
                    <p>{{ message }}</p>
                {% endfor %}
            </div>
        {% endif %}
    {% endwith %}

    <form method="POST">

        <div>
            <label for="departure_time">
                Departure Time
            </label><br>

            <input
                type="time"
                id="departure_time"
                name="departure_time"
                required
            >
        </div>

        <br>

        <button type="submit">
            Create Schedule
        </button>

    </form>

    <p>
        <a href="{{ url_for(
            'schedules.list_schedules',
            route_id=route.id
        ) }}">
            Back to Schedules
        </a>
    </p>

</body>

</html>
