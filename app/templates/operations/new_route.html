
{% extends "internal_base.html" %}

{% block title %}New Route | MatatuHub{% endblock %}

{% block content %}
<div class="hr-page">

    <div class="page-header">
        <div>
            <h1>Register New Route</h1>
            <p>Enter the details of the new transport route.</p>
        </div>
    </div>

    <div class="profile-section">
        <form method="POST" class="employee-form">

            <div class="form-group">
                <label for="name">Route Name</label>
                <input
                    type="text"
                    id="name"
                    name="name"
                    required
                >
            </div>

            <div class="form-group">
                <label for="start_point">Start Point</label>
                <input
                    type="text"
                    id="start_point"
                    name="start_point"
                    required
                >
            </div>

            <div class="form-group">
                <label for="destination">Destination</label>
                <input
                    type="text"
                    id="destination"
                    name="destination"
                    required
                >
            </div>

            <button type="submit" class="btn btn-primary">
                Create Route
            </button>

            <a href="{{ url_for('operations.list_routes') }}" class="btn">
                Cancel
            </a>

        </form>
    </div>

</div>
{% endblock %}
