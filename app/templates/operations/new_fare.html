<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>New Fare - MatatuHub</title>
</head>

<body>

    <h1>New Fare</h1>

    <h2>{{ route.name }}</h2>

    {% with messages = get_flashed_messages() %}
        {% if messages %}
            <div>
                {% for message in messages %}
                    <p>{{ message }}</p>
                {% endfor %}
            </div>
        {% endif %}
    {% endwith %}

    <form method="POST">

        <div>
            <label for="direction">
                Direction
            </label><br>

            <input
                type="text"
                id="direction"
                name="direction"
                placeholder="e.g. Towards CBD"
                required
            >
        </div>

        <br>

        <div>
            <label for="time_band">
                Time Band
            </label><br>

            <select
                id="time_band"
                name="time_band"
                required
            >
                <option value="">
                    Select time band
                </option>

                <option value="peak">
                    Peak
                </option>

                <option value="off_peak">
                    Off-Peak
                </option>

            </select>
        </div>

        <br>

        <div>
            <label for="amount">
                Fare Amount
            </label><br>

            <input
                type="number"
                id="amount"
                name="amount"
                min="0.01"
                step="0.01"
                required
            >
        </div>

        <br>

        <div>
            <label for="effective_from">
                Effective From
            </label><br>

            <input
                type="date"
                id="effective_from"
                name="effective_from"
                required
            >
        </div>

        <br>

        <button type="submit">
            Create Fare
        </button>

    </form>

    <p>
        <a href="{{ url_for(
            'operations.list_fares',
            route_id=route.id
        ) }}">
            Back to Fares
        </a>
    </p>

</body>

</html>
