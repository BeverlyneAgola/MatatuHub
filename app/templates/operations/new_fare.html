
{% extends "internal_base.html" %}

{% block title %}New Fare | MatatuHub{% endblock %}

{% block content %}
<div class="hr-page">

    <div class="page-header">
        <div>
            <h1>Add New Fare</h1>
            <p>Route: {{ route.name }}</p>
        </div>
    </div>

    <div class="profile-section">
        <form method="POST" class="employee-form">

            <div class="form-group">
                <label for="direction">Direction</label>
                <input
                    type="text"
                    id="direction"
                    name="direction"
                    placeholder="e.g. Towards CBD"
                    required
                >
            </div>

            <div class="form-group">
                <label for="time_band">Time Band</label>
                <select id="time_band" name="time_band" required>
                    <option value="">Select time band</option>
                    <option value="peak">Peak</option>
                    <option value="off_peak">Off-Peak</option>
                </select>
            </div>

            <div class="form-group">
                <label for="amount">Fare Amount</label>
                <input
                    type="number"
                    id="amount"
                    name="amount"
                    min="0.01"
                    step="0.01"
                    required
                >
            </div>

            <div class="form-group">
                <label for="effective_from">Effective From</label>
                <input
                    type="date"
                    id="effective_from"
                    name="effective_from"
                    required
                >
            </div>

            <button type="submit" class="btn btn-primary">
                Create Fare
            </button>

            <a href="{{ url_for('operations.list_fares', route_id=route.id) }}"
               class="btn">
                Cancel
            </a>

        </form>
    </div>

</div>
{% endblock %}
