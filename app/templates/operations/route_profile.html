<!DOCTYPE html>
<html lang="en">


<head>
    <meta charset="UTF-8">
    <title>Route Details - MatatuHub</title>
</head>

<body>


    <p>TEST - NEW ROUTE PROFILE TEMPLATE</p>
    <h1>Route Details</h1>

    <table border="1" cellpadding="8">

        <tr>
            <th>Route Name</th>
            <td>{{ route.name }}</td>
        </tr>

        <tr>
            <th>Start Point</th>
            <td>{{ route.start_point }}</td>
        </tr>

        <tr>
            <th>Destination</th>
            <td>{{ route.destination }}</td>
        </tr>

        <tr>
            <th>Status</th>
            <td>{{ route.status }}</td>
        </tr>

    </table>


    <p>
        <a href="{{ url_for(
            'operations.list_fares',
            route_id=route.id
        ) }}">
            View Fares
        </a>
    </p>

    <p>
        <a href="{{ url_for(
            'schedules.list_schedules',
            route_id=route.id
        ) }}">
            View Schedules
        </a>
    </p>

    <p>
        <a href="{{ url_for('operations.list_routes') }}">
            Back to Routes
        </a>
    </p>
    
</body>

</html>
