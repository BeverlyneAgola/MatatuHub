{% extends "internal_base.html" %}

{% block title %}Fleet Management - MatatuHub{% endblock %}

{% block extra_css %}
<style>
    .fleet-wrapper {
        max-width: 1200px;
        margin: 0 auto;
    }

    .fleet-card {
        background: #fff;
        border: 1px solid #e0e4e8;
        border-radius: 8px;
        padding: 22px;
        margin-bottom: 22px;
    }

    .fleet-card h2 {
        margin-top: 0;
    }

    .fleet-table-wrapper {
        width: 100%;
        overflow-x: auto;
    }

    .fleet-table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 12px;
    }

    .fleet-table th,
    .fleet-table td {
        text-align: left;
        padding: 12px;
        border-bottom: 1px solid #e5e7eb;
    }

    .fleet-table th {
        background: #f3f5f7;
    }

    .fleet-form {
        display: grid;
        gap: 16px;
        max-width: 650px;
    }

    .fleet-form label {
        display: block;
        font-weight: 600;
        margin-bottom: 6px;
    }

    .fleet-form input,
    .fleet-form select,
    .fleet-form textarea {
        box-sizing: border-box;
        width: 100%;
        padding: 10px;
        border: 1px solid #cbd2d9;
        border-radius: 5px;
        font: inherit;
    }

    .fleet-form textarea {
        min-height: 110px;
        resize: vertical;
    }

    .fleet-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin: 16px 0;
    }

    .fleet-button {
        display: inline-block;
        border: none;
        border-radius: 5px;
        padding: 10px 15px;
        background: #263d59;
        color: #fff;
        text-decoration: none;
        cursor: pointer;
        font: inherit;
    }

    .fleet-button:hover {
        opacity: 0.9;
    }

    .fleet-button-secondary {
        background: #596675;
    }

    .fleet-button-danger {
        background: #a93232;
    }

    .fleet-details {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 14px;
    }

    .fleet-detail {
        padding: 14px;
        background: #f7f8fa;
        border-radius: 5px;
    }

    .fleet-detail strong {
        display: block;
        margin-bottom: 5px;
    }

    .fleet-muted {
        color: #68727d;
    }

    @media (max-width: 600px) {
        .fleet-card {
            padding: 15px;
        }
    }
</style>
{% endblock %}


{% block content %}

<div class="fleet-wrapper">

    {% block fleet_content %}{% endblock %}

</div>

{% endblock %}
