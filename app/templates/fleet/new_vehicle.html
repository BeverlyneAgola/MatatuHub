
{% extends "fleet/fleet_base.html" %}

{% block title %}Add Vehicle - MatatuHub{% endblock %}

{% block fleet_content %}
<section class="fleet-card">
    <h2>Register a Vehicle</h2>
    <p class="fleet-muted">Enter the vehicle details below.</p>

    <form method="POST" class="fleet-form">
        <div>
            <label for="reg_no">Registration Number *</label>
            <input
                type="text"
                id="reg_no"
                name="reg_no"
                required
                maxlength="30"
                value="{{ request.form.get('reg_no', '') }}"
            >
        </div>

        <div>
            <label for="make">Make</label>
            <input
                type="text"
                id="make"
                name="make"
                maxlength="100"
                value="{{ request.form.get('make', '') }}"
            >
        </div>

        <div>
            <label for="year">Year of Manufacture</label>
            <input
                type="number"
                id="year"
                name="year"
                min="1900"
                max="2100"
                value="{{ request.form.get('year', '') }}"
            >
        </div>

        <div>
            <label for="type">Vehicle Type</label>
            <input
                type="text"
                id="type"
                name="type"
                maxlength="100"
                value="{{ request.form.get('type', '') }}"
            >
        </div>

        <div>
            <label for="ownership">Ownership</label>
            <select id="ownership" name="ownership">
                <option value="">Select ownership</option>
                <option value="owned"
                    {% if request.form.get('ownership') == 'owned' %}selected{% endif %}>
                    Owned
                </option>
                <option value="leased"
                    {% if request.form.get('ownership') == 'leased' %}selected{% endif %}>
                    Leased
                </option>
            </select>
        </div>

        <div class="fleet-actions">
            <button type="submit" class="fleet-button">Save Vehicle</button>
            <a href="{{ url_for('fleet.list_vehicles') }}"
               class="fleet-button fleet-button-secondary">
                Cancel
            </a>
        </div>
    </form>
</section>
{% endblock %}
