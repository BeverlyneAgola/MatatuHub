
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Add Vehicle - MatatuHub</title>
</head>

<body>

    <h1>Add Vehicle</h1>

    <form method="POST">

        <p>
            <label for="reg_no">
                Registration Number
            </label>

            <input
                type="text"
                id="reg_no"
                name="reg_no"
                required
            >
        </p>

        <p>
            <label for="make">
                Make
            </label>

            <input
                type="text"
                id="make"
                name="make"
            >
        </p>

        <p>
            <label for="year">
                Year
            </label>

            <input
                type="number"
                id="year"
                name="year"
            >
        </p>

        <p>
            <label for="type">
                Vehicle Type
            </label>

            <input
                type="text"
                id="type"
                name="type"
            >
        </p>

        <p>
            <label for="ownership">
                Ownership
            </label>

            <input
                type="text"
                id="ownership"
                name="ownership"
            >
        </p>

        <button type="submit">
            Add Vehicle
        </button>

    </form>

    <p>
        <a href="{{ url_for('fleet.list_vehicles') }}">
            Back to Vehicles
        </a>
    </p>

</body>

</html>
