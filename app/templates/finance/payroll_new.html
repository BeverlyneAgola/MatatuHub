

<h1>Generate Payroll</h1>

<p>
    <a href="{{ url_for('finance.list_payroll') }}">
        Back to Payroll
    </a>
</p>

<hr>

<form
    method="POST"
    action="{{ url_for('finance.new_payroll') }}"
>

    <div>
        <label for="employee_id">Employee</label>

        <select
            id="employee_id"
            name="employee_id"
            required
        >

            <option value="">Select Employee</option>

            {% for employee in employees %}

                <option value="{{ employee.id }}">

                    {{ employee.first_name }}
                    {{ employee.last_name }}
                    ({{ employee.staff_id }})

                </option>

            {% endfor %}

        </select>
    </div>

    <br>

    <div>
        <label for="period">Payroll Period</label>

        <input
            type="month"
            id="period"
            name="period"
            required
        >
    </div>

    <br>

    <div>
        <label for="basic_salary">Basic Salary (KSh)</label>

        <input
            type="number"
            id="basic_salary"
            name="basic_salary"
            min="0.01"
            step="0.01"
            required
        >
    </div>

    <br>

    <div>
        <label for="allowance">Allowance (KSh)</label>

        <input
            type="number"
            id="allowance"
            name="allowance"
            min="0"
            step="0.01"
            value="0"
        >
    </div>

    <hr>

    <h2>Deductions</h2>

    <p>
        Add deduction types and amounts.
        Empty rows will be ignored.
    </p>

    <div>
        <label for="deduction_type_1">Deduction 1 Type</label>

        <select
            id="deduction_type_1"
            name="deduction_type"
        >
            <option value="">None</option>
            <option value="NHIF">NHIF</option>
            <option value="NSSF">NSSF</option>
            <option value="SACCO">SACCO</option>
            <option value="Loan Repayment">Loan Repayment</option>
            <option value="Other">Other</option>
        </select>

        <label for="deduction_amount_1">Amount (KSh)</label>

        <input
            type="number"
            id="deduction_amount_1"
            name="deduction_amount"
            min="0"
            step="0.01"
        >
    </div>

    <br>

    <div>
        <label for="deduction_type_2">Deduction 2 Type</label>

        <select
            id="deduction_type_2"
            name="deduction_type"
        >
            <option value="">None</option>
            <option value="NHIF">NHIF</option>
            <option value="NSSF">NSSF</option>
            <option value="SACCO">SACCO</option>
            <option value="Loan Repayment">Loan Repayment</option>
            <option value="Other">Other</option>
        </select>

        <label for="deduction_amount_2">Amount (KSh)</label>

        <input
            type="number"
            id="deduction_amount_2"
            name="deduction_amount"
            min="0"
            step="0.01"
        >
    </div>

    <br>

    <button type="submit">
        Generate Draft Payroll
    </button>

</form>
